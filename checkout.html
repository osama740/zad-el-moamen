<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>صفحة الدفع - زاد المؤمن</title>
  <link rel="stylesheet" href="assets/css/checkout.css" />
  <script src="assets/js/cache-cleanup.js"></script>
  
</head>
<body>



<nav class="main-nav">
  <div class="container">
    <a href="index.html">الرئيسية</a>
    <a href="checkout.html" class="active">الدفع</a>
    <a href="about.html">من نحن</a>
    <a href="contact.html">تواصل معنا</a>
  </div>
</nav>

<header class="main-header">
  <div class="container">
    <h1>إتمام الدفع</h1>
    <p>أدخل بيانات البطاقة لإتمام عملية الشراء بأمان وسرعة.</p>
  </div>
</header>

<!-- ✅ ملخص السلة -->
<section class="cart-summary container">
  <h2>🛒 ملخص المشتريات</h2>
  <div id="cart-items"></div>
  <div class="total" id="total-price"></div>
  <button class="empty-cart" id="clear-cart">إفراغ السلة</button>

<!-- نافذة تأكيد الحذف -->
<div id="confirmModal" class="modal">
  <div class="modal-content">
    <p>⚠️ هل أنت متأكد أنك تريد إفراغ السلة؟</p>
    <div class="modal-buttons">
      <button id="confirmYes">نعم، إفراغ</button>
      <button id="confirmNo">إلغاء</button>
    </div>
  </div>
</div>


</section>

<!-- ✅ فورمة الدفع -->
<section class="payment-section">
  <div class="container">
    <form class="payment-form" action="#" method="post" novalidate>
      
      <label for="fullname">اسم حامل البطاقة:</label>
      <input type="text" id="fullname" name="fullname" placeholder="الاسم كما هو مكتوب على البطاقة" required />

      <label for="cardnumber">رقم البطاقة:</label>
      <input type="text" id="cardnumber" name="cardnumber" maxlength="19" placeholder="xxxx xxxx xxxx xxxx" pattern="[\d ]{13,19}" inputmode="numeric" autocomplete="cc-number" required />

      <div class="form-row">
        <div class="form-group">
          <label for="expiry">تاريخ الانتهاء:</label>
          <input type="month" id="expiry" name="expiry" required />
        </div>
        <div class="form-group">
          <label for="cvv">CVV:</label>
          <input type="password" id="cvv" name="cvv" maxlength="4" placeholder="xxx" pattern="\d{3,4}" required />
        </div>
      </div>

      <button type="submit" class="btn hero-btn">إتمام الدفع</button>
    </form>
  </div>
</section>





<script src="assets/js/main.js"></script>
</body>
</html>
